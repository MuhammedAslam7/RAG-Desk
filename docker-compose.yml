services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_support_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ai_support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ai_support_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@ragdesk.app}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-RAG Desk}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: http://localhost:3000

  frontend:
    build: ./frontend
    container_name: ai_support_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}

  adminer:
    image: adminer
    container_name: ai_support_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: